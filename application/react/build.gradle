plugins {
    id 'base'
}

def projectDir = file("${rootDir}/application/react")
def terraformDir = file("${rootDir}/infra/terraform/localstack")

tasks.register('npmInstall', Exec) {
    description = "Install npm dependencies"
    group = "build"

    workingDir = projectDir
    commandLine = ["npm", "install"]

    inputs.file("package.json")
    inputs.file("package-lock.json")
    outputs.dir("node_modules")
}

tasks.register('updateEnvLocalStack', Exec) {
    group = "build"
    description = "Update .env.localstack with LocalStack API Gateway URL"

    workingDir terraformDir
    commandLine "bash", "-c", """
        API_URL=\$(terraform output -raw api_gateway_url 2>/dev/null || echo '')
        if [ -n "\$API_URL" ]; then
            echo "# LocalStack API Gateway endpoint (auto-generated)" > ${projectDir}/.env.localstack
            echo "# Do not edit manually - this file is regenerated on each build" >> ${projectDir}/.env.localstack
            echo "VITE_API_BASE_URL=\${API_URL}" >> ${projectDir}/.env.localstack
            echo "Updated .env.localstack with API Gateway URL: \$API_URL"
        else
            echo "Warning: Could not get API Gateway URL from Terraform"
        fi
    """
}

tasks.register('npmBuild', Exec) {
    description = "Build React application (use -Penv=localstack|dev|uat|prod, default: localstack)"
    group = "build"

    dependsOn(npmInstall)

    doFirst {
        def env = project.findProperty('env') ?: 'localstack'
        println "Building React app for environment: ${env}"
    }

    workingDir = projectDir
    commandLine "bash", "-c", """
        ENV=\${1:-localstack}
        case "\$ENV" in
            prod) npm run build ;;
            *) npm run build:\$ENV ;;
        esac
    """, "bash", project.findProperty('env') ?: 'localstack'

    inputs.dir("src")
    inputs.file("index.html")
    inputs.file("vite.config.js")
    inputs.file("package.json")
    outputs.dir("dist")
}

tasks.named("build") {
    dependsOn(npmBuild)
}

tasks.register('buildLocal', Exec) {
    group = "build"
    description = "Build React application for localstack environment"

    dependsOn updateEnvLocalStack, npmInstall

    workingDir projectDir
    commandLine "npx", "vite", "build", "--mode", "localstack"

    inputs.dir("src")
    inputs.file("index.html")
    inputs.file("vite.config.js")
    inputs.file("package.json")
    outputs.dir("dist")
}

clean {
    println("Deleting build files for ${projectDir}...")
    delete("${projectDir}/dist", "${projectDir}/node_modules")
}