// Integration test source set
sourceSets {
    integrationTest {
        java {
            srcDir 'src/integrationTest/java'
        }
        resources {
            srcDir 'src/integrationTest/resources'
        }
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

dependencies {

    // Core Spring Boot Functionality - MVC (traditional servlet-based)
    implementation 'org.springframework.boot:spring-boot-starter-web'  // Traditional MVC web framework
    implementation 'org.springframework.boot:spring-boot-starter-security'  // Security for CSRF configuration

    // AWS Lambda Support
    implementation 'com.amazonaws.serverless:aws-serverless-java-container-springboot3'
    implementation 'com.amazonaws:aws-lambda-java-core'
    implementation 'com.amazonaws:aws-lambda-java-events'

    // AWS SDK for S3 (version managed by BOM in root build.gradle)
    implementation 'software.amazon.awssdk:s3'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Integration test dependencies
    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-test'
    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-web'
    integrationTestImplementation 'io.rest-assured:rest-assured'
    integrationTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.bootJar {
    enabled = false
}

tasks.jar {
    enabled = true
}

shadowJar {
    archiveFileName = 'solastra.jar'
    mergeServiceFiles()

    append('META-INF/spring.handlers')
    append('META-INF/spring.schemas')
    append('META-INF/spring.tooling')
    append('META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports')

    transform(com.github.jengelman.gradle.plugins.shadow.transformers.PropertiesFileTransformer) {
        paths = ['META-INF/spring.factories']
        mergeStrategy = "append"
    }

    manifest {
        attributes 'Main-Class': 'com.solastra.Api'
        attributes 'Start-Class': 'com.solastra.Api'
    }

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('processIntegrationTestResources') {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('integrationTest', Test) {
    group = "verification"
    description = "Run integration tests against LocalStack"
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath

    useJUnitPlatform()

    shouldRunAfter test

    doFirst {
        // Get API Gateway URL from environment or Terraform output
        def apiBaseUrl = System.getenv('API_BASE_URL')
        if (!apiBaseUrl) {
            try {
                def terraformDir = file("${rootProject.projectDir}/infra/terraform/localstack")
                def outputStream = new ByteArrayOutputStream()
                def result = exec {
                    workingDir terraformDir
                    commandLine 'terraform', 'output', '-raw', 'localstack_api_url'
                    standardOutput = outputStream
                    ignoreExitValue = true
                }
                if (result.exitValue == 0) {
                    apiBaseUrl = outputStream.toString().trim()
                }
            } catch (Exception e) {
                logger.warn("Could not get API Gateway URL from Terraform: ${e.message}")
            }
        }

        if (apiBaseUrl) {
            systemProperty 'api.base.url', apiBaseUrl
            logger.lifecycle("Using API Gateway URL: ${apiBaseUrl}")
        }
    }

    // Pass environment variables to tests
    systemProperty 'aws.endpoint', System.getenv('AWS_ENDPOINT') ?: 'http://localhost:4566'
    systemProperty 'aws.region', System.getenv('AWS_REGION') ?: 'us-east-1'
    systemProperty 'aws.accessKeyId', System.getenv('AWS_ACCESS_KEY_ID') ?: 'test'
    systemProperty 'aws.secretAccessKey', System.getenv('AWS_SECRET_ACCESS_KEY') ?: 'test'
}

tasks.register('buildZip', Zip) {
    dependsOn shadowJar
    from(zipTree(shadowJar.archiveFile))
    archiveFileName = 'solastra.zip'
    destinationDirectory = layout.buildDirectory.dir("distributions")
}

tasks.register('buildLocal') {
    group = "build"
    description = "Build application for localstack environment"
    dependsOn buildZip
}
