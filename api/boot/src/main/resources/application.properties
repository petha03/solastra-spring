spring.application.name=solastra-api

# HTTP Encoding
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# MVC Multipart configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AWS Configuration
aws.region=us-east-1
aws.s3.bucket-name=solastra
aws.s3.endpoint=http://localhost.localstack.cloud:4566
aws.access-key-id=test
aws.secret-access-key=test

# JWT Configuration
jwt.secret=your-256-bit-secret-key-change-this-in-production-min-32-chars
jwt.expiration-ms=86400000
