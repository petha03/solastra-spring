plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

group = 'com.solastra'
version = '0.0.1-SNAPSHOT'

ext {
    set('springCloudVersion', "2025.0.0")
}



allprojects {
    repositories {
        mavenCentral()
    }
}

configure(subprojects.findAll { it.path == ':api:boot' }) {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.github.johnrengelman.shadow'

    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }

        dependencies { 
            dependency 'com.amazonaws:aws-lambda-java-core:1.2.3'
            dependency 'com.amazonaws:aws-lambda-java-events:3.14.0'
            dependency 'com.amazonaws.serverless:aws-serverless-java-container-springboot3:2.1.5'
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}

// LocalStack deployment tasks
def localstackDir = file("${projectDir}/infra/terraform/localstack")

tasks.register('recreateLocalStack', Exec) {
    group = "deployment"
    dependsOn ':api:boot:buildLocal', ':application:vue:buildLocal'

    doFirst {
        println "Recreating LocalStack..."
    }

    workingDir localstackDir
    commandLine "bash", "-c", "docker compose down && docker compose up -d"
}

tasks.register('restartLocalStack', Exec) {
    group = "deployment"
    dependsOn ':api:boot:buildLocal', ':application:vue:buildLocal'

    doFirst {
        println "Restarting LocalStack..."
    }

    workingDir localstackDir
    commandLine "bash", "-c", "docker compose restart localstack"
}

tasks.register('applyTerraForm', Exec) {
    group = "deployment"
    dependsOn restartLocalStack

    doFirst {
        println "Applying Terraform..."
    }
    workingDir localstackDir
    commandLine "bash", "-c", "terraform apply -auto-approve"
}

tasks.register('deployLocal') {
    group = "deployment"
    dependsOn applyTerraForm
}

// Run Vue application development server
tasks.register('runVue', Exec) {
    group = "application"
    description = "Run Vue application development server with hot-reload"
    dependsOn ':application:vue:npmInstall'

    doFirst {
        println "Starting Vue application development server..."
        println "Application will be available at http://localhost:5173"
    }

    workingDir file("${projectDir}/application/vue")
    commandLine "npm", "run", "local", "--", "--port", "3972"
}
