plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

group = 'com.solastra'
version = '0.0.1-SNAPSHOT'

ext {
    set('springCloudVersion', "2025.0.0")
}



allprojects {
    repositories {
        mavenCentral()
    }
}

configure(subprojects.findAll { it.path == ':api:boot' }) {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.github.johnrengelman.shadow'

    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
            mavenBom "software.amazon.awssdk:bom:2.20.26"
        }

        dependencies {
            dependency 'com.amazonaws:aws-lambda-java-core:1.2.3'
            dependency 'com.amazonaws:aws-lambda-java-events:3.14.0'
            dependency 'com.amazonaws.serverless:aws-serverless-java-container-springboot3:2.1.5'
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}

// LocalStack deployment tasks
def localstackDir = file("${projectDir}/infra/terraform/localstack")

tasks.register('recreateLocalStack', Exec) {
    group = "deployment"
    dependsOn ':api:boot:buildLocal', ':application:vue:buildLocal'

    doFirst {
        println "Recreating LocalStack..."
    }

    workingDir localstackDir
    commandLine "bash", "-c", "docker compose down && docker compose up -d"
}

tasks.register('restartLocalStack', Exec) {
    group = "deployment"
    dependsOn ':api:boot:buildLocal', ':application:vue:buildLocal'

    doFirst {
        println "Restarting LocalStack..."
    }

    workingDir localstackDir
    commandLine "bash", "-c", "docker compose restart localstack"
}

tasks.register('applyTerraForm', Exec) {
    group = "deployment"
    dependsOn restartLocalStack

    doFirst {
        println "Applying Terraform..."
    }
    workingDir localstackDir
    commandLine "bash", "-c", "terraform apply -auto-approve"
}

tasks.register('updateVueEnv', Exec) {
    group = "deployment"
    dependsOn applyTerraForm

    doFirst {
        println "Updating Vue environment with LocalStack API URL..."
    }
    workingDir localstackDir
    commandLine "bash", "-c", """
        API_URL=\$(terraform output -raw localstack_api_url 2>/dev/null || echo '')
        if [ -n "\$API_URL" ]; then
            echo "# LocalStack API Gateway endpoint (auto-generated)" > ${projectDir}/application/vue/.env.localstack
            echo "# Do not edit manually - this file is regenerated on each deployment" >> ${projectDir}/application/vue/.env.localstack
            echo "VITE_API_BASE_URL=\${API_URL}" >> ${projectDir}/application/vue/.env.localstack
            echo "Updated .env.localstack with LocalStack API URL: \$API_URL"
        else
            echo "Warning: Could not get LocalStack API URL from Terraform"
        fi
    """
}

tasks.register('updateHttpClientEnv', Exec) {
    group = "deployment"
    dependsOn applyTerraForm

    doFirst {
        println "Updating HTTP client environment configuration..."
    }
    workingDir localstackDir
    commandLine "bash", "-c", """
        API_ID=\$(terraform output -raw api_gateway_id 2>/dev/null || echo '')
        if [ -n "\$API_ID" ]; then
            BASE_URL="http://localhost:4566/restapis/\${API_ID}/dev"
            cat > ${projectDir}/api/tests/http-client.env.json <<EOF
{
  "dev": {
    "apiId": "\${API_ID}",
    "baseUrl": "\${BASE_URL}"
  }
}
EOF
            echo "Updated http-client.env.json with API Gateway ID: \$API_ID"
            echo "Base URL: \$BASE_URL"
        else
            echo "Warning: Could not get API Gateway ID from Terraform"
        fi
    """
}

tasks.register('rebuildVueForLocalStack', Exec) {
    group = "deployment"
    dependsOn updateVueEnv

    doFirst {
        println "Rebuilding Vue app with updated environment..."
    }

    workingDir file("${projectDir}/application/vue")
    commandLine "npx", "vite", "build", "--mode", "localstack"
}

tasks.register('uploadVueToS3', Exec) {
    group = "deployment"
    dependsOn rebuildVueForLocalStack

    doFirst {
        println "Uploading Vue app to S3..."
    }
    commandLine "docker", "exec", "localstack-solastra", "awslocal", "s3", "sync", "/tmp/vue-app", "s3://solastra-vue-app/", "--delete"
}

tasks.register('deployLocal') {
    group = "deployment"
    dependsOn uploadVueToS3, updateHttpClientEnv

    doLast {
        println ""
        println "=".repeat(60)
        println "Deployment Complete!"
        println "=".repeat(60)
        println "Vue App: http://solastra-vue-app.s3-website.localhost.localstack.cloud:4566"
        println "API Gateway: Run 'cd infra/terraform/localstack && terraform output api_gateway_url'"
        println "HTTP Client: api/tests/http-client.env.json updated with API Gateway ID"
        println "=".repeat(60)
    }
}

// Run Vue application development server
tasks.register('runVue', Exec) {
    group = "application"
    description = "Run Vue application development server with hot-reload"
    dependsOn ':application:vue:npmInstall'

    doFirst {
        println "Starting Vue application development server..."
        println "Application will be available at http://localhost:5173"
    }

    workingDir file("${projectDir}/application/vue")
    commandLine "npm", "run", "local", "--", "--port", "3972"
}
